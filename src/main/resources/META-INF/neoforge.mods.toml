modLoader="javafml"
loaderVersion="[1,)"
license="${license}"
issueTrackerURL="${issue_tracker}"

[[mods]]
  modId="${mod_id}"
  displayName="${display_name}"
  description="${description}"
  version="${version}"
  displayURL="${display_url}"
  updateJSONURL="${update_url}"
  authors="${authors}"
  credits="${credits}"
  itemIcon="survivalistessentials:rock_stone"
  logoFile="${logo_file}"
[[mixins]]
